<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#1d2230"/>
      <stop offset="1" stop-color="#07080c"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc35a"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0.55" stop-color="#ff9e1c" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff9e1c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Fundo -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Brilho e círculo de aproximação -->
  <circle cx="256" cy="256" r="230" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="#ff9e1c" stroke-opacity="0.35" stroke-width="6"/>
  <!-- Círculo da nota (borda branca + anel laranja) -->
  <circle cx="256" cy="256" r="168" fill="#11141c"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="34"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="#ffffff" stroke-width="14"/>
  <!-- Mira do CS -->
  <g fill="#ffffff">
    <rect x="248" y="150" width="16" height="62" rx="3"/>
    <rect x="248" y="300" width="16" height="62" rx="3"/>
    <rect x="150" y="248" width="62" height="16" rx="3"/>
    <rect x="300" y="248" width="62" height="16" rx="3"/>
  </g>
  <!-- "!" do os!strike no centro -->
  <rect x="245" y="222" width="22" height="40" rx="5" fill="#ff9e1c"/>
  <circle cx="256" cy="282" r="11" fill="#ff9e1c"/>
</svg>
